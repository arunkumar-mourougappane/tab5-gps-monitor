; PlatformIO project for M5Stack Tab5 (ESP32-P4) reading NMEA data
; from the M5Stack GPS/BDS Unit v1.1 (AT6668/ATGM336H) and logging to USB serial.
;
; Tab5 has no official board in mainline platform-espressif32 yet, so this
; uses the pioarduino fork, which ships a Tab5-specific board definition.
; Platform version is pinned to 55.03.35 (Arduino core 3.3.5 / IDF 5.5.1) --
; newer IDF 5.5.2-based builds have a known MIPI-DSI backlight flicker
; regression on Tab5. Do not float this to `develop` or `latest`.

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.35
board = m5stack-tab5-p4
board_build.mcu = esp32p4
framework = arduino

upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git
    mikalhart/TinyGPSPlus@^1.0.3
